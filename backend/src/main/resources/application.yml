# Gymlet backend configuration
#
# Profiles:
#   (default)  embedded H2, in-memory — zero setup, data is wiped on restart.
#   mysql      PostgreSQL (yes, despite the legacy name): local Postgres/Supabase
#              via docker compose, DB_URL / DB_USER / DB_PASSWORD env vars.
#   prod       Render.com + Supabase PostgreSQL. Activate with
#              SPRING_PROFILES_ACTIVE=prod; see application-prod.yml for the
#              required environment variables.

spring:
  application:
    name: gymlet

  datasource:
    url: jdbc:h2:mem:gymlet;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    root: info
    com.gymlet: info
