# Gymlet backend configuration
#
# Default profile: embedded H2 (in-memory) — zero setup, data is wiped on restart.
# For persistent MySQL:  docker compose up -d   then run with the "mysql" profile:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# (connection details can be overridden with DB_URL / DB_USER / DB_PASSWORD env vars)

spring:
  application:
    name: gymlet

  datasource:
    url: jdbc:h2:mem:gymlet;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    root: info
    com.gymlet: info
